<section class="section band-glow">
  <div class="container glow-row">
    <div>
      <h2 class="h-lg">Ski it this season.</h2>
      <p class="sub">Free on the App Store for iPhone, with no account and no ads.</p>
    </div>
    {% comment %}Apple allows one App Store badge per layout. Pages that already show it (body_badge: true) get a text link here.{% endcomment %}
    {% if page.body_badge %}
    <a class="btn btn-white" href="{{ site.appstore_url }}">Download for iPhone <span aria-hidden="true">→</span></a>
    {% else %}
    <a class="appstore-badge" href="{{ site.appstore_url }}"><img src="/assets/img/appstore-badge.svg" alt="Download on the App Store" width="150" height="50"></a>
    {% endif %}
  </div>
</section>
